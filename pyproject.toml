[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "refcompat"
version = "0.1.0.dev0"
description = "Evidence-backed genomic reference and resource compatibility checking"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Greg Roe" },
]
keywords = [
    "bioinformatics",
    "genomics",
    "reference genome",
    "refget",
    "seqcol",
    "VCF",
    "BAM",
    "CRAM",
    "GFF",
    "GTF",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "pysam>=0.24,<0.25",
    "refget>=0.12,<0.13",
]

[project.urls]
Homepage = "https://github.com/GregRR/refcompat"
Repository = "https://github.com/GregRR/refcompat"
Issues = "https://github.com/GregRR/refcompat/issues"

[project.scripts]
refcompat = "refcompat.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "mypy>=2.3,<2.4",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.3,<0.17",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".refcompat-local",
    "research",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]
exclude = "(^|/)(\\.refcompat-local|research)/"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true

[tool.uv.build-backend]
source-exclude = [
    ".refcompat-local/**",
    "research/**",
]
